name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/make-app.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelManager
          path: dist/ReelManager.zip

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ReelManager.zip \
            --title "Reel Manager (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: right-click the app and choose Open the first time." \
            --latest
